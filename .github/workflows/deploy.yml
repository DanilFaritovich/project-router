name: ProjectRouter production CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'DanilFaritovich/project-router' &&
      github.event.workflow_run.head_repository.full_name == 'DanilFaritovich/project-router'
    # Reviewed immutable Manager implementation. All VDS policy/rollout remains there.
    uses: DanilFaritovich/portfolio-deployment/.github/workflows/cd-deploy.yml@8447d610f398cc77098f5c95d10d78baba2bf4be
    with:
      kind: application
    secrets: inherit
