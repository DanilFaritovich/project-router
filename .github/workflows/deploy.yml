name: ProjectRouter production CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'DanilFaritovich/project-router' &&
      github.event.workflow_run.head_repository.full_name == 'DanilFaritovich/project-router'
    # Reviewed immutable Manager implementation. All VDS policy/rollout remains there.
    uses: DanilFaritovich/portfolio-deployment/.github/workflows/cd-deploy.yml@3c5421d1729c3d5ea4563a301464f67f3d1347d2
    with:
      kind: application
    secrets: inherit
