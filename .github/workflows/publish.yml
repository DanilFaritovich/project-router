name: GHCR publication
# Only the CI workflow calls this after all checks pass for the same push SHA.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'DanilFaritovich/project-router' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require confirmed origin for stable and release images
        if: github.ref != 'refs/heads/develop'
        env:
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
        run: test -n "$VITE_SITE_ORIGIN" || { echo 'Set the confirmed HTTPS origin in repository variable VITE_SITE_ORIGIN before stable/release publication.'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/danilfaritovich/project-router
          flavor: latest=false
          tags: |
            type=raw,value=develop-sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=main-sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/DanilFaritovich/project-router
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VITE_SITE_ORIGIN=${{ vars.VITE_SITE_ORIGIN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=project-router-publish
          cache-to: type=gha,mode=max,scope=project-router-publish
          provenance: mode=min
      - name: Published immutable identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/danilfaritovich/project-router@$DIGEST"
          echo "Image: \`ghcr.io/danilfaritovich/project-router@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
